services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: env_mon_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  postgres:
    image: postgres:16-alpine
    container_name: env_mon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: env_user
      POSTGRES_PASSWORD: env_password
      POSTGRES_DB: env_monitoring
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U env_user -d env_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: env_mon_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://env_user:env_password@postgres:5432/env_monitoring
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data: