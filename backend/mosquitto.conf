# Listen on standard MQTT port across all interfaces (LAN / Hotspot)
listener 1883 0.0.0.0

# Allow anonymous connections for local development[span_12](start_span)[span_12](end_span)
allow_anonymous true

# Persist QoS 1 queued messages and subscriptions across broker restarts
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` captures broker activity
log_dest stdout